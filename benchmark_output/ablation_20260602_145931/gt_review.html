const MATERIALS = {"ablation_a": {"Deckschicht": "SMA 11 S", "Binderschicht": "AC 16 B S", "Bituminöse Tragschicht": "AC 22 T S", "Nicht bituminöse Tragschicht": "STSuB 0/45", "Frostschutzschicht": "FSS 0/32"}, "ablation_b": {"Deckschicht": "SMA 8 S mit Polymodifiziertem Bindemittel 10/40-65A", "Binderschicht": "AC 16 B S SG mit Polymermodifiziertem Bindemittel 10/40-65A", "Bituminöse Tragschicht": "AC 32 T S mit Straßenbaubitumen 30/45", "Nicht bituminöse Tragschicht": "AC 32 T S mit Straßenbaubitumen 30/45", "Frostschutzschicht": "Gesteinskörnungsgemisch 0/32"}, "ablation_c": {"Deckschicht": "Splittmastixasphalt, lärmreduzierend, feine Körnung", "Binderschicht": "Asphaltzwischenschicht mit polymermodifiziertem Bitumen, Körnung 16mm", "Bituminöse Tragschicht": "grobe Asphalttragschicht mit Normalbitumen, hohe Tragfähigkeit", "Nicht bituminöse Tragschicht": "Schotter ungebunden, gebrochenes Korn 0-45", "Frostschutzschicht": "Kies-Sand-Gemisch frostsicher, natürlich gewonnen, bis 32mm"}};

// State: selections[input][layer] = uuid | null | undefined
const selections = {};

function init() {
  const inputs = Object.keys(DATA);
  document.getElementById('run-label').textContent =
    `${inputs.length} Inputs · ${inputs[0] ? DATA[inputs[0]].total_runs : 0} Runs je Input`;

  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');

  inputs.forEach((inp, i) => {
    selections[inp] = {};

    // Tab
    const tab = document.createElement('div');
    tab.className = 'tab' + (i === 0 ? ' active' : '');
    tab.textContent = inp.replace('ablation_', 'Input ').toUpperCase();
    tab.onclick = () => activateTab(inp);
    tab.id = 'tab-' + inp;
    tabsEl.appendChild(tab);

    // Panel
    const panel = document.createElement('div');
    panel.className = 'panel' + (i === 0 ? ' active' : '');
    panel.id = 'panel-' + inp;
    panel.innerHTML = buildPanel(inp);
    panelsEl.appendChild(panel);
  });

  updateProgress();
}

function activateTab(inp) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + inp).classList.add('active');
  document.getElementById('panel-' + inp).classList.add('active');
}

function buildPanel(inp) {
  const layerData = DATA[inp].layers;
  const total = DATA[inp].total_runs;
  let html = `<p class="run-info" style="margin-bottom:12px;text-align:right">
    ${total} valide Runs · Top-${Object.values(layerData)[0]?.length || 7} Kandidaten</p>`;

  for (const [layer, candidates] of Object.entries(layerData)) {
    const mat = MATERIALS[inp]?.[layer] || '';
    html += `
    <div class="layer-card" id="card-${inp}-${esc(layer)}">
      <div class="layer-header">
        <div>
          <div class="layer-title">${layer}</div>
          ${mat ? `<div class="layer-material">MATERIAL: <code>${mat}</code></div>` : ''}
        </div>
        <span class="gt-badge unset" id="badge-${inp}-${esc(layer)}">nicht gesetzt</span>
      </div>
      <div class="candidates">`;

    candidates.forEach(c => {
      const barW = Math.round(c.pct);
      html += `
        <div class="candidate" id="cand-${inp}-${esc(layer)}-${esc(c.uuid || 'none')}"
             onclick="select('${inp}','${layer}','${c.uuid || ''}')">
          <div class="bar-wrap"><div class="bar" style="width:${barW}%"></div></div>
          <div class="pct">${c.pct}%</div>
          <div class="cnt">${c.count}×</div>
          <div class="epd-info">
            <div class="epd-name">${c.name}</div>
            <div class="epd-klass">${c.klassifizierung}</div>
            <div class="epd-uuid">${c.uuid || '—'}</div>
          </div>
        </div>`;
    });

    html += `</div>
      <button class="null-btn" id="nullbtn-${inp}-${esc(layer)}"
              onclick="selectNull('${inp}','${layer}')">
        ⊘ Kein passendes EPD in DB (ground_truth = null)
      </button>
    </div>`;
  }
  return html;
}

function esc(s) {
  return (s || '').replace(/[^a-zA-Z0-9]/g, '_');
}

function select(inp, layer, uuid) {
  selections[inp][layer] = uuid || null;
  refreshCard(inp, layer);
  updateProgress();
}

function selectNull(inp, layer) {
  selections[inp][layer] = null;
  refreshCard(inp, layer);
  updateProgress();
}

function refreshCard(inp, layer) {
  const val = selections[inp][layer];
  const isNull = val === null && Object.prototype.hasOwnProperty.call(selections[inp], layer)
                 && val === null;
  const isExplicitNull = selections[inp].hasOwnProperty(layer) && selections[inp][layer] === null;

  // Badges
  const badge = document.getElementById(`badge-${inp}-${esc(layer)}`);
  const nullBtn = document.getElementById(`nullbtn-${inp}-${esc(layer)}`);
  const candidates = document.querySelectorAll(`[id^="cand-${inp}-${esc(layer)}-"]`);

  candidates.forEach(el => {
    el.classList.remove('selected', 'selected-null');
    el.querySelector('.bar').style.background = '#4a90d9';
  });
  nullBtn.classList.remove('selected-null');

  if (!selections[inp].hasOwnProperty(layer)) {
    badge.textContent = 'nicht gesetzt';
    badge.className = 'gt-badge unset';
  } else if (selections[inp][layer] === null) {
    badge.textContent = 'null (kein EPD)';
    badge.className = 'gt-badge null';
    nullBtn.classList.add('selected-null');
  } else {
    const uuid = selections[inp][layer];
    const cand = DATA[inp].layers[layer]?.find(c => c.uuid === uuid);
    badge.textContent = cand ? cand.name.substring(0, 30) : uuid.substring(0, 8);
    badge.className = 'gt-badge set';
    const candEl = document.getElementById(`cand-${inp}-${esc(layer)}-${esc(uuid)}`);
    if (candEl) {
      candEl.classList.add('selected');
      candEl.querySelector('.bar').style.background = '#4caf50';
    }
  }
}

function updateProgress() {
  let total = 0, done = 0;
  for (const inp of Object.keys(DATA)) {
    for (const layer of Object.keys(DATA[inp].layers)) {
      total++;
      if (selections[inp].hasOwnProperty(layer)) done++;
    }
  }
  document.getElementById('progress-label').innerHTML =
    `<strong>${done}</strong> von <strong>${total}</strong> Schichten bewertet`;
}

function buildGT(inp) {
  const gt = {};
  for (const layer of Object.keys(DATA[inp].layers)) {
    gt[layer] = selections[inp].hasOwnProperty(layer) ? selections[inp][layer] : '__UNSET__';
  }
  return gt;
}

function exportCurrent() {
  const inp = document.querySelector('.tab.active').id.replace('tab-', '');
  const gt = buildGT(inp);
  download(`ground_truth_${inp}.json`, JSON.stringify(gt, null, 2));
}

function exportAll() {
  const all = {};
  for (const inp of Object.keys(DATA)) {
    all[inp] = buildGT(inp);
  }
  // Als 3 separate Files
  for (const [inp, gt] of Object.entries(all)) {
    download(`ground_truth_${inp}.json`, JSON.stringify(gt, null, 2));
  }
}

function download(filename, content) {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(content);
  a.download = filename;
  a.click();
}

init();
</script>
